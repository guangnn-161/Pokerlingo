name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions: { contents: read }
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pokerlingo
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d pokerlingo"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pokerlingo
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.15.4 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm db:generate\n      - run: git diff --exit-code -- packages/db/drizzle || (echo 'Drizzle schema/migration metadata is out of date; run pnpm db:generate and commit the generated metadata.' && exit 1)\n      - run: pnpm db:migrate
      - run: pnpm db:seed
      - run: pnpm test
      - run: pnpm build
